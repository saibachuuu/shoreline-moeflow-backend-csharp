name: shoreline-csharp-test
services:
  mongo:
    image: mongo:8.0
    ports: ["127.0.0.1:27128:27017"]
    tmpfs: ["/data/db", "/data/configdb"]
    mem_limit: 512m
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30
  s3:
    image: adobe/s3mock@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    ports: ["127.0.0.1:29128:9090"]
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: shoreline-test
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx192m
    tmpfs: ["/data"]
    mem_limit: 384m
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:21128:1025", "127.0.0.1:28128:8025"]
    mem_limit: 64m
