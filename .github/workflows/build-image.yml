name: Build Docker image

# 只在打了版本 tag 的时候构建并推送镜像；普通 push / PR 只跑 check-pr.yml。
# tag 必须先通过下面的格式校验，格式是 v<major>.<minor>.<patch>，
# 允许后面跟预发布后缀，例如 v1.2.3、v1.2.3-rc.1。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # tag filter 只能是 glob，v* 会放进 vNext、v-test 这类名字；这里做一次
      # 严格校验，格式不对直接失败，不产出镜像。
      - name: Validate tag format
        if: github.event_name == 'push'
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::tag '${GITHUB_REF_NAME}' does not match v<major>.<minor>.<patch>[-prerelease]"
            exit 1
          fi

      # arm64 要通过 QEMU 跑 .NET SDK，没有这一步第二次平台构建会直接失败。
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            # 预发布 tag（v1.2.3-rc.1）不覆盖 latest。
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Dockerfile 已 pin sdk/aspnet 的 multi-arch manifest digest，
          # 这里两个平台都用同一份构建定义。
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
